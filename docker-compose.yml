services:
  db:
    image: postgres:16-alpine
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: patient_booking_rails
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U booking -d patient_booking_rails']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
